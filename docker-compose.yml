# Local Postgres + Redis matching the Railway setup.
#   docker compose up -d
#   DATABASE_URL=postgres://shop:shop@localhost:5544/shop REDIS_URL=redis://localhost:6390 npm run dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports: ["5544:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6390:6379"]
volumes:
  pgdata:
